# Config del servicio n8n en Railway (servicio con root directory = raíz del repo).
#
# HISTÓRICO: c34b94b revirtió un railway.toml raíz anterior porque el servicio
# del frontend desplegaba desde la raíz y este fichero lo interfería. Hoy
# frontend y backend despliegan desde sus subdirectorios con sus propios
# railway.toml (frontend/railway.toml, backend/railway.toml), así que este
# fichero solo aplica a un servicio configurado sobre la raíz (n8n).
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.n8n"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Persistencia de workflows/credenciales de n8n entre deploys (IN-001).
[deploy.volume]
name = "n8n-data"
mountPath = "/home/node/.n8n"
