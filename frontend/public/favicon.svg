<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SPHERE">
  <!--
    Favicon PROVISIONAL (tarea 0.4). El logo de verdad es un activo pendiente y
    llega en la tarea 3.9 de la fase 3: DESIGN §10 lo describe como «un SVG
    monocromo de una sola forma que funcione a 16px y grabado en latón: un
    anillo de sello con un arco de mesa dentro», y dice expresamente que «es un
    activo pendiente y va en la lista de entregables, no se improvisa».

    Esto es el anillo de sello desnudo, sin el arco de mesa: monocromo, una sola
    forma, legible a 16px. Sustituye a `vite.svg`, que era el favicon por
    defecto de Vite. `currentColor` no sirve en un favicon, así que el latón va
    literal: brass-500 = #D7A94F.
  -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#D7A94F" stroke-width="2.5" />
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#D7A94F" stroke-width="1.25" />
</svg>
