<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SPHERE">
  <!--
    El logo de la tarea 3.9, con el latón literal: un favicon no hereda color,
    así que `currentColor` no sirve aquí. brass-500 = #D7A94F.

    Es el mismo dibujo que `logo.svg` — anillo de sello (§8.3) con el arco de la
    mesa (§8.1) dentro—, para que la pestaña y la barra lateral enseñen la misma
    marca. Antes esto era el anillo desnudo, marcado como provisional a la
    espera de esta tarea.
  -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#D7A94F" stroke-width="2.5" />
  <path d="M 7.5 19.5 A 9.5 9.5 0 0 1 24.5 19.5" fill="none" stroke="#D7A94F" stroke-width="2.25" stroke-linecap="round" />
</svg>
