<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SPHERE">
  <!--
    D53 · DESIGN §10: «un SVG monocromo de una sola forma que funcione a 16px y
    grabado en latón: un anillo de sello con un arco de mesa dentro».

    Anillo de sello (el acta, §8.3) con el arco de la mesa (§8.1) dentro: los
    dos efectos que definen el producto, en una marca de dos trazos. Sin
    relleno, sin degradado, sin sombra — se graba, no se ilumina (§P3).

    `currentColor` para que la marca tome el color de su sitio de uso. El
    favicon lleva el latón literal porque un favicon no hereda color.
  -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5" />
  <path d="M 9 21.5 A 7.5 7.5 0 0 1 23 21.5" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" />
</svg>
