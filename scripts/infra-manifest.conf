# scripts/infra-manifest.conf — origen ÚNICO de las invariantes de infraestructura.
#
# Formato:  kind|scope|value|note      ('#' = comentario; ningún campo lleva '|')
#
# Lo leen, sin duplicar nada:
#   - scripts/check-monorepo-invariants.sh   (bash: while IFS='|' read -r ...)
#   - backend/tests/test_infra_manifest.py   (pytest: line.split("|", 3))
#
# Añadir una línea aquí basta para que ambos consumidores la apliquen. Reescribir
# una regla a mano en cualquiera de los dos pone en rojo el meta-test
# test_manifiesto_es_el_unico_origen: así fue exactamente como el guard y la suite
# llegaron a contradecirse (uno exigía un fichero que el otro prohibía).
#
# La explicación para humanos vive en docs/CONEXIONES_Y_N8N_SETUP.md, que enlaza
# a este fichero. Aquí NO van secretos ni URLs inventadas.
#
# kinds:
#   root_forbidden        fichero que no puede existir en la raíz del monorepo
#   root_forbidden_glob   patrón prohibido en la raíz; define además qué ficheros
#                         son Dockerfiles a efectos de dockerfile_forbidden
#   dockerfile_forbidden  instrucción que ningún Dockerfile del repo puede declarar
#   env_required          variable que el dueño configura en Railway (scope: n8n|backend)
#   env_forbidden         nombre de variable inexistente; no debe aparecer en ningún documento
#   compose_required      variable que el servicio n8n de docker-compose debe declarar
#   doc_forbidden         frase que ningún documento puede afirmar
#   setting               ajuste operativo cuyo valor decide el dueño

# ── Raíz del monorepo ────────────────────────────────────────────────
root_forbidden|-|railway.toml|Configuraría backend y frontend a la vez; cada servicio se configura en su propio dashboard
root_forbidden_glob|-|Dockerfile*|Un Dockerfile en la raíz arrastra el backend al build del frontend (rootDirectory vacío)

# ── Dockerfiles del repositorio ──────────────────────────────────────
dockerfile_forbidden|-|VOLUME|Railway aborta el build (instrucción no soportada); la persistencia se logra con un Railway Volume

# ── Servicio n8n en Railway (lo configura el dueño a mano) ───────────
env_required|n8n|N8N_HOST|Host público del servicio n8n
env_required|n8n|N8N_PORT|Puerto en el que escucha n8n (5678)
env_required|n8n|N8N_PROTOCOL|Esquema de las URLs que n8n genera (https en Railway)
env_required|n8n|WEBHOOK_URL|URL pública de n8n con barra final; éste es el nombre correcto de la variable
env_required|n8n|N8N_USER_FOLDER|Sin ella n8n guarda su base fuera del volumen y cada redeploy borra workflows y API key
env_required|n8n|N8N_ENCRYPTION_KEY|Cifra las credenciales que n8n guarda; si cambia dejan de descifrarse
env_required|n8n|DB_TYPE|Motor de persistencia de n8n (sqlite sobre el volumen montado)
env_required|n8n|SPHERE_BACKEND_URL|URL pública del backend a la que los workflows devuelven el callback firmado
env_required|n8n|NODE_FUNCTION_ALLOW_BUILTIN|El nodo Verify Signature necesita require('crypto') para el HMAC
env_required|n8n|N8N_BLOCK_ENV_ACCESS_IN_NODE|n8n bloquea el acceso al entorno en nodos Code y el nodo de verificación lee el secreto de ahí
env_required|n8n|N8N_WEBHOOK_SECRET|Secreto compartido con el backend; firma y verifica los webhooks en ambos sentidos

# ── Servicio backend en Railway ─────────────────────────────────────
env_required|backend|N8N_BASE_URL|URL del n8n al que el backend despliega workflows y llama webhooks
env_required|backend|N8N_API_KEY|API key de n8n para crear y activar workflows
env_required|backend|N8N_WEBHOOK_SECRET|El mismo secreto que el servicio n8n; sin él la integración queda apagada

# ── Nombres que no existen ──────────────────────────────────────────
env_forbidden|-|N8N_WEBHOOK_URL|Variable inexistente; el nombre correcto es WEBHOOK_URL (env_required del servicio n8n)

# ── docker-compose local (backend/docker-compose.yaml) ──────────────
compose_required|n8n|N8N_WEBHOOK_SECRET|Sin el secreto el nodo Verify Signature lanza y los 18 workflows fallan en su primer nodo
compose_required|n8n|NODE_FUNCTION_ALLOW_BUILTIN=crypto|Habilita require('crypto') en los nodos Code del n8n local
compose_required|n8n|N8N_BLOCK_ENV_ACCESS_IN_NODE=false|Permite que el nodo de verificación lea el secreto del entorno

# ── Frases que ningún documento puede afirmar (IN-005) ──────────────
doc_forbidden|-|Falta desplegar el servidor n8n|Del estado de la instancia responde scripts/check-n8n-health.sh, no un documento
doc_forbidden|-|Deploy from Dockerfile|Reintroduce el build que Railway aborta: ese Dockerfile declaraba la instrucción prohibida
doc_forbidden|-|n8n-production-16d81.up.railway.app|Afirma la URL de la instancia; vive en la variable del backend y su estado lo responde el script

# ── Ajustes operativos ──────────────────────────────────────────────
setting|-|N8N_NONCE_GRACE_DEADLINE=<ISO>|Tras esta fecha main.py emite CRITICAL si la gracia del nonce sigue activa; la fija el dueño
