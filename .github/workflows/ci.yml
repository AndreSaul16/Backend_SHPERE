# CI de SPHERE — tests de backend (pytest con Mongo/Redis reales) y frontend (tsc + vitest).
#
# Historia: se retiró en 1867ff4 porque Railway marcaba los deploys como SKIPPED
# esperando estos checks, y se reincorporó el 2026-07-12 apuntando a `main`. Pero
# la única rama del repo es `master` (origin/HEAD -> origin/master), así que el
# workflow no se ha ejecutado nunca: el refactor visual iba a llegar a producción
# sin ningún gate automático.
#
# Por qué NO se dispara en push a master: es exactamente lo que provocó los
# deploys SKIPPED en 1867ff4, y la configuración de Railway no se puede verificar
# desde el repo. Dejando master intacto, el comportamiento de deploy no cambia y
# el problema histórico no puede reproducirse. El gate se obtiene igual:
#   - pull_request contra master        -> puerta de merge (no dispara deploy de prod)
#   - push a ramas feat/** y redesign/** -> verificación continua durante el desarrollo
# Si algún día se quiere el check también en push a master, primero confirmar en
# el dashboard de Railway que el servicio no espera a los checks de GitHub.
#
# `redesign/**` se añadió para el rediseño visual v3: vive en una rama larga
# (`redesign/visual-identity-v3`) y sin este patrón el pipeline seguiría sin
# ejecutarse nunca durante las ~24-31 jornadas de la refactorización, que es
# exactamente el agujero que la tarea 0.0 del plan viene a tapar.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: ['feat/**', 'redesign/**']

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    services:
      mongodb:
        image: mongo:7
        ports:
          - "27017:27017"
      redis:
        image: redis:7
        ports:
          - "6379:6379"
    env:
      MONGODB_URL: mongodb://localhost:27017
      DB_NAME: sphere_test
      REDIS_URL: redis://localhost:6379/0
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: development
      OPENAI_API_KEY: sk-test-ci
      DEEPSEEK_API_KEY: sk-test-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

  test-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # `tsc --noEmit` es un no-op aquí: tsconfig.json es solution-style
      # ("files": [] + references), así que sin -b comprueba CERO ficheros y
      # sale 0 siempre. El -b recorre tsconfig.app.json y tsconfig.node.json.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --noEmit
      # vitest directo en vez de `npm test`: corepack puede redirigir npm a pnpm
      # y romper el paso por un motivo ajeno a los tests.
      - name: Run tests
        working-directory: frontend
        run: npx vitest run

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff (backend, no bloqueante)
        run: pipx run ruff check backend/app
