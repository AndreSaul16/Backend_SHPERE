# CI de SPHERE — tests de backend (pytest con Mongo/Redis reales) y frontend (tsc + vitest).
#
# Historia: se retiró en 1867ff4 porque Railway marcaba los deploys como SKIPPED
# esperando estos checks, y se reincorporó el 2026-07-12 apuntando a `main`. Pero
# la única rama del repo es `master` (origin/HEAD -> origin/master), así que el
# workflow no se ha ejecutado nunca: el refactor visual iba a llegar a producción
# sin ningún gate automático.
#
# Por qué NO se dispara en push a master: es exactamente lo que provocó los
# deploys SKIPPED en 1867ff4, y la configuración de Railway no se puede verificar
# desde el repo. Dejando master intacto, el comportamiento de deploy no cambia y
# el problema histórico no puede reproducirse. El gate se obtiene igual:
#   - pull_request contra master        -> puerta de merge (no dispara deploy de prod)
#   - push a ramas feat/** y redesign/** -> verificación continua durante el desarrollo
# Si algún día se quiere el check también en push a master, primero confirmar en
# el dashboard de Railway que el servicio no espera a los checks de GitHub.
#
# `redesign/**` se añadió para el rediseño visual v3: vive en una rama larga
# (`redesign/visual-identity-v3`) y sin este patrón el pipeline seguiría sin
# ejecutarse nunca durante las ~24-31 jornadas de la refactorización, que es
# exactamente el agujero que la tarea 0.0 del plan viene a tapar.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: ['feat/**', 'redesign/**']

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    services:
      mongodb:
        image: mongo:7
        ports:
          - "27017:27017"
      redis:
        image: redis:7
        ports:
          - "6379:6379"
    env:
      MONGODB_URL: mongodb://localhost:27017
      DB_NAME: sphere_test
      REDIS_URL: redis://localhost:6379/0
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: development
      OPENAI_API_KEY: sk-test-ci
      DEEPSEEK_API_KEY: sk-test-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

  test-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # `tsc --noEmit` es un no-op aquí: tsconfig.json es solution-style
      # ("files": [] + references), así que sin -b comprueba CERO ficheros y
      # sale 0 siempre. El -b recorre tsconfig.app.json y tsconfig.node.json.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --noEmit
      # vitest directo en vez de `npm test`: corepack puede redirigir npm a pnpm
      # y romper el paso por un motivo ajeno a los tests.
      - name: Run tests
        working-directory: frontend
        run: npx vitest run
      # En Tailwind v4 una clase que el compilador no reconoce no genera CSS y
      # no avisa: se queda en el HTML sin efecto. Así acumuló este repo 326
      # declaraciones de color inertes sin que nada fallara nunca. El detector
      # compila src/index.css con el PostCSS del proyecto y diffea los nombres
      # de clase emitidos contra los tokens de clase de src/**. No compila el
      # bundle: sólo procesa CSS.
      - name: Clases muertas
        working-directory: frontend
        run: node scripts/check-dead-classes.mjs

      # ── Tarea 4.12 · presupuesto de arranque ──────────────────────────────
      #
      # La fase 4 sacó del arranque las trece rutas, los cinco visores de
      # artefacto, el asistente de creación de agentes y las cinco secciones de
      # ajustes. Sin una puerta, eso se deshace solo: basta con que alguien
      # añada un `import` estático en `App.tsx` —o en cualquier fichero que
      # cuelgue de él— para devolver un módulo entero al camino crítico, y no
      # falla nada ni se ve en la revisión.
      #
      # El presupuesto de DESIGN §7 y del plan: entry ≤ 220 KB gzip,
      # CSS ≤ 45 KB gzip.
      #
      # POR QUÉ ESTE PASO VIVE SÓLO EN CI: el proyecto no compila en local por
      # decisión del dueño. Aquí sí se compila, así que aquí es donde se puede
      # medir. Consecuencia que hay que saber: la primera ejecución de este job
      # es también la PRIMERA MEDICIÓN REAL del presupuesto. Si sale por encima,
      # el número que hay que mirar es el desglose por chunk que el script
      # imprime, no el techo.
      #
      # `npx vite build` y no `npm run build`: el typecheck ya corrió arriba con
      # `tsc -b`, y `npm run build` lo repetiría entero.
      - name: Build de producción
        working-directory: frontend
        run: npx vite build
      - name: Presupuesto de arranque (entry ≤ 220 KB gzip · CSS ≤ 45 KB gzip)
        working-directory: frontend
        run: node scripts/check-bundle-budget.mjs
      # LO QUE FALTA DE 4.12, dicho aquí y no en un documento aparte: el tercer
      # presupuesto de la tarea es «LCP ≤ 2,0 s en 4G simulada». NO está puesto,
      # y el motivo es que hoy no se puede medir de forma que signifique algo:
      #
      #   · Medir LCP exige servir la app y cargarla con un Chrome de verdad
      #     (Lighthouse). La app arranca en `/login` y desde ahí no hay LCP
      #     representativo: lo que hay que medir es la primera pantalla del
      #     producto, y ésa vive detrás de Firebase Auth.
      #   · Sin sesión sembrada, la medición sería la de una pantalla de
      #     entrada — un número verde que no dice nada del producto.
      #
      # Lo que hace falta para cerrarlo, y va con la 8.4 del plan (perfil de
      # rendimiento contra el móvil de referencia): un usuario de prueba
      # sembrado, un `vite preview` en el job y `lighthouse --preset=desktop
      # --throttling-method=simulate` con presupuesto en `budget.json`. Mientras
      # tanto, los dos presupuestos de tamaño sí son puerta dura, y son los que
      # protegen el trabajo de code splitting de esta fase.

      # El artefacto se sube SIEMPRE, también cuando el presupuesto falla: sin
      # el `dist/` no hay forma de averiguar qué entró en el chunk desde la
      # máquina de nadie.
      - name: Guardar el build para poder mirarlo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-frontend
          path: frontend/dist
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ruff (backend, no bloqueante)
        run: pipx run ruff check backend/app
